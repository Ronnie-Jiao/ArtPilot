name: Build ArtPilot script

on:
  push:
    paths:
      - '.build/**'
      - '.github/workflows/build-artpilot.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild Illustrator script
        shell: bash
        run: |
          cat .build/part-*.b64 | base64 -d | gzip -d > AI_工具箱.jsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_工具箱.jsx
          git diff --cached --quiet || git commit -m "Add ArtPilot Illustrator script"
          git push
